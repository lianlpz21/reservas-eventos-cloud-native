services:

  storage-service:
    image: ${DOCKERHUB_USER}/cloudnative-storage:${IMAGE_TAG}
    container_name: cloudnative-storage
    environment:
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      EFS_PATH: /mnt/efs
    volumes:
      - /mnt/efs:/mnt/efs
    expose:
      - "8081"
    restart: unless-stopped

  document-service:
    image: ${DOCKERHUB_USER}/cloudnative-documents:${IMAGE_TAG}
    container_name: cloudnative-documents
    environment:
      STORAGE_SERVICE_URL: http://storage-service:8081
    ports:
      - "8080:8080"
    depends_on:
      - storage-service
    restart: unless-stopped
